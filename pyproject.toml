[project]
name = "opcal-mlt"
version = "0.3.1"
description = "OPCAL-Labeler: manual labeling tool for calcium imaging traces"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "OPCAL Team" }]

dependencies = [
  "streamlit>=1.36,<2.0",
  "numpy>=1.26,<2.0",
  "pandas>=2.2,<3.0",
  "scipy>=1.12,<2.0",
  "matplotlib>=3.8,<4.0",
  "plotly>=5.22,<6.0",
  "Pillow>=10,<11",
  "pydantic>=2.5,<3.0"
]

[project.scripts]
opcal-mlt = "opcal_mlt.launch:main"
opcal-mlt-dev = "opcal_mlt.cli:dev_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["opcal*"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"