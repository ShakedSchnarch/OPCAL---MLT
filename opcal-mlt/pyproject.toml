[tool.poetry]
name = "opcal-mlt"
version = "0.1.0"
description = "OPCAL Manual Labeling Tool for calcium imaging traces"
authors = ["OPCAL Team"]
readme = "README.md"
packages = [{ include = "app" }, { include = "core" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
streamlit = "^1.36.0"
numpy = "^1.26.0"
pandas = "^2.2.0"
scipy = "^1.12.0"
pydantic = "^2.5.0"
plotly = "^5.22.0"
matplotlib = "^3.8.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
black = "^24.0.0"
ruff = "^0.5.0"
mypy = "^1.10.0"
pre-commit = "^3.7.0"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
