name: release-builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows:
    name: Windows executable ZIP
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"
          python -m pip install "pyinstaller>=6.3"

      - name: Unit tests
        shell: pwsh
        run: |
          python -m pytest
          python -m ruff check src tests tools

      - name: Build console QA executable
        shell: pwsh
        run: |
          python tools\distribution\build.py --clean --console --name OPCAL-MLT-QA --no-zip

      - name: Smoke test console QA executable
        shell: pwsh
        run: |
          .\dist\executables\windows\OPCAL-MLT-QA\OPCAL-MLT-QA.exe --version
          .\dist\executables\windows\OPCAL-MLT-QA\OPCAL-MLT-QA.exe --diagnostics

          $server = Start-Process `
            -FilePath ".\dist\executables\windows\OPCAL-MLT-QA\OPCAL-MLT-QA.exe" `
            -ArgumentList "--headless --server.port 8765" `
            -PassThru

          try {
            $ok = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 2
              try {
                $response = Invoke-WebRequest -UseBasicParsing http://localhost:8765
                if ($response.StatusCode -eq 200) {
                  $ok = $true
                  break
                }
              } catch {
                # Server is still starting.
              }
            }
            if (-not $ok) {
              throw "Packaged Streamlit app did not respond on localhost:8765"
            }
          } finally {
            if ($server -and -not $server.HasExited) {
              Stop-Process -Id $server.Id -Force
            }
          }

      - name: Build final windowed executable
        shell: pwsh
        run: |
          python tools\distribution\build.py --clean

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: OPCAL-MLT-windows
          path: dist/executables/windows/OPCAL-MLT-*-windows.zip
          if-no-files-found: error

  macos:
    name: macOS app ZIP
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"
          python -m pip install "pyinstaller>=6.3"

      - name: Unit tests
        run: |
          python -m pytest
          python -m ruff check src tests tools

      - name: Build macOS app
        run: |
          python tools/distribution/build.py --clean

      - name: Smoke test macOS app
        run: |
          dist/executables/macos/OPCAL-MLT.app/Contents/MacOS/OPCAL-MLT --version
          dist/executables/macos/OPCAL-MLT.app/Contents/MacOS/OPCAL-MLT --diagnostics

      - name: Upload macOS ZIP
        uses: actions/upload-artifact@v4
        with:
          name: OPCAL-MLT-macos
          path: dist/executables/macos/OPCAL-MLT-*-macos.zip
          if-no-files-found: error
