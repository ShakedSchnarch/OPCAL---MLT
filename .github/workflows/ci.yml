name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Lint
        run: |
          pip install black ruff mypy
          black --check .
          ruff check .
          mypy core app --ignore-missing-imports
      - name: Test
        run: pytest -q
