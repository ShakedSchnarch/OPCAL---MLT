name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          # אם תרצה גם כלי סגנון:
          # pip install pytest ruff black

      - name: Test
        run: |
          pytest -q
          # אם מוסיפים בדיקות סגנון:
          # ruff check .
          # black --check .